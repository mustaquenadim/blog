name: CLA

on:
  issue_comment:
    types: [created]
  pull_request_target:
    types: [opened, closed, synchronize]

permissions:
  actions: write
  contents: write
  pull-requests: write
  statuses: write

jobs:
  cla:
    name: Check CLA signature
    runs-on: ubuntu-latest

    steps:
      - name: CLA assistant
        if: >
          (github.event.comment.body == 'recheck' ||
           github.event.comment.body == 'I have read the CLA Document and I hereby sign the CLA') ||
          github.event_name == 'pull_request_target'
        uses: contributor-assistant/github-action@v2.6.1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          # Signatures are stored on a dedicated branch so they never appear in
          # regular diffs. The branch is created automatically on first use.
          branch: cla-signatures
          path-to-signatures: signatures/version1/cla.json
          path-to-document: https://github.com/mustaquenadim/blog/blob/master/CLA.md
          custom-notsigned-prcomment: >
            Thank you for your contribution. Before this pull request can be
            merged, please read our [Contributor License
            Agreement](https://github.com/mustaquenadim/blog/blob/master/CLA.md)
            and sign it by posting a comment below with exactly the following
            text:
          custom-pr-sign-comment: I have read the CLA Document and I hereby sign the CLA
          custom-allsigned-prcomment: All contributors have signed the CLA. Thank you!
          # The maintainer and bots do not need to sign.
          allowlist: mustaquenadim,dependabot[bot],github-actions[bot]
