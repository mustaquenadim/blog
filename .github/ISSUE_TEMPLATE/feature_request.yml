name: Feature request
description: Suggest a capability or improvement.
title: "feat: "
labels: [enhancement, needs-triage]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for the suggestion.

        This project is an early scaffold and its architecture is still in flux,
        so proposals that change structure are especially welcome right now — but
        please expect discussion before implementation.

  - type: checkboxes
    id: preflight
    attributes:
      label: Preflight checks
      options:
        - label: I searched existing issues and discussions for this idea.
          required: true

  - type: textarea
    id: problem
    attributes:
      label: What problem does this solve?
      description: >
        Describe the underlying need rather than the solution. Understanding the
        problem often surfaces a better approach than the one first imagined.
      placeholder: |
        I am trying to ... but currently ....
    validations:
      required: true

  - type: textarea
    id: solution
    attributes:
      label: Proposed solution
      description: What you would like to see happen.
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Other approaches you weighed, and why you set them aside.

  - type: dropdown
    id: scope
    attributes:
      label: Rough scope
      description: Your best guess — it is fine to be wrong.
      options:
        - Small — a self-contained change
        - Medium — touches several areas
        - Large — architectural or cross-cutting
        - No idea
    validations:
      required: true

  - type: checkboxes
    id: contribution
    attributes:
      label: Contribution
      options:
        - label: I am willing to open a pull request for this.
        - label: >
            I understand that contributions require signing the
            [CLA](https://github.com/mustaquenadim/blog/blob/master/CLA.md).
